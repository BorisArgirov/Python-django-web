{% extends 'base.html' %}

{% block content %}
<section class="py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <article class="card border-0 shadow-sm">
                <div class="card-body p-4 p-lg-5">
                    <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
                        <div>
                            <p class="text-primary fw-semibold mb-2">Book Review</p>
                            <h1 class="display-6 fw-bold mb-2">{{ review.book.title }}</h1>
                            <p class="text-secondary mb-0">By {{ review.author }}</p>
                        </div>
                        <span class="badge bg-primary fs-5">{{ review.rating }}</span>
                    </div>

                    <p class="lead">{{ review.body }}</p>
                    <p class="small text-secondary">Published: {{ review.created_at }}</p>

                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <a class="btn btn-primary" href="{% url 'books:detail' review.book.slug %}">View Book</a>
                        <a class="btn btn-outline-primary" href="{% url 'reviews:recent' %}">Back to Reviews</a>
                    </div>
                </div>
            </article>
        </div>
    </div>
</section>
{% endblock %}
