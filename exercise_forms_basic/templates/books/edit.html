{% extends 'books/book_form.html' %}

{% block content %}
    <section class="page-heading">
        <h1>Edit Book</h1>
        <p class="subtitle">Update the information for this title.</p>
    </section>
    <section class="card">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">Save changes</button>
                <a class="button secondary" href="{% url 'books:book_form' %}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
